<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#1a2332"/>
  <g transform="translate(32,34) scale(0.52)">
    <!-- Outer circle (C-shape, open at top-right) -->
    <path d="M38,-48 A52,52 0 1,0 38,10" stroke="#25C990" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="0" cy="-18" r="7" fill="#25C990"/>
    <!-- Body - S-curve flowing down -->
    <path d="M0,-10 C-4,0 -14,16 -8,34 C-4,44 4,44 8,36 C14,24 6,8 0,-2" fill="#25C990"/>
    <!-- Leaf shape pointing upper-right -->
    <path d="M4,-6 C12,-16 28,-36 42,-38 C42,-38 36,-18 16,-4 Z" fill="#25C990"/>
    <!-- Leaf vein -->
    <path d="M6,-8 C16,-18 30,-30 40,-36" stroke="#1a2332" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
